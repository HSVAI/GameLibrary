<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="HSVAI에서 만든 게임을 모아 둔 저장소입니다.">
  <title>HSVAI 게임 저장소</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>게임 저장소</h1>
        <p>HSVAI에서 만든 게임을 모아 두었습니다.</p>
      </div>
      <a href="https://github.com/HSVAI">GitHub</a>
    </header>

    <section class="game-list" aria-label="게임 목록">
      <article class="game-card">
        <img src="assets/ghost-shift.png" alt="Ghost Shift 플레이 화면" width="450" height="800">
        <div class="game-info">
          <h2>Ghost Shift</h2>
          <p>탭으로 두 레인을 오가며 장애물을 피하는 원터치 생존 게임입니다.</p>
          <a href="https://hsvai.github.io/GhostShift/play/?quality=high">게임 실행</a>
        </div>
      </article>

      <article class="game-card">
        <img src="assets/bounce-lab.png" alt="Bounce Lab 플레이 화면" width="450" height="800">
        <div class="game-info">
          <h2>Bounce Lab</h2>
          <p>자동으로 튀는 공을 좌우로 조종하는 플랫폼 게임입니다. 맵 제작과 공유도 지원합니다.</p>
          <a href="https://hsvai.github.io/BounceLab/play/?quality=high">게임 실행</a>
        </div>
      </article>

      <article class="game-card">
        <img src="assets/zine-3d.png" alt="Zine 3D 캐릭터" width="512" height="512">
        <div class="game-info">
          <h2>Zine 3D</h2>
          <p>먹이를 모으며 몸을 늘리는 지네를 조종하는 3D 아케이드 게임입니다.</p>
          <a href="https://ghtnql.github.io/Zine3D/">게임 실행</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
